# CI: build, vet and test every package with the race detector, build the container images and push
# them to this project's container registry, then deploy them to the k3s server.
# The e2e script (tools/e2e) needs the whole Docker stack, so it runs locally, see docs/development.md.

stages:
  - test
  - build
  - deploy

variables:
  GOFLAGS: -mod=readonly
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOPATH: $CI_PROJECT_DIR/.cache/go

default:
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go
      - .cache/go-build

test:
  stage: test
  # The golang image includes gcc, which -race needs (cgo).
  image: golang:1.25
  variables:
    CGO_ENABLED: "1"
  rules:
    # On a merge request the tests wait for the play button, so a draft can be pushed and
    # looked at without spending a runner. Start them before merging: nothing else checks
    # the branch until main runs them.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    # develop is paused to save shared runner minutes (the free quota is 400 a month): the tests run on main,
    # before the images are built and deployed. Run them on your machine before merging. To run them on
    # develop again, add:  || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - go build ./...
    - go vet ./...
    - go test -race -count=1 ./...

# Builds the images of platform, social and realtime, and the migration image of each, for amd64
# and arm64 (the Oracle server is ARM), and pushes them to $CI_REGISTRY_IMAGE:
#   registry.gitlab.com/clan-platform/clan-backend/social:<short commit sha>
#   registry.gitlab.com/clan-platform/clan-backend/social-migrate:<short commit sha>
# Each image also gets the branch name as a tag (develop, main), and latest on main.
#
# Runs after the tests pass, on main. On a merge request it can be started by hand
# (the ▶ button in the pipeline), to try the images of a branch before it is merged; those images
# are tagged with the branch name.
#
# The Dockerfiles cross-compile Go, so building for arm64 needs no emulation.
images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    PLATFORMS: linux/amd64,linux/arm64
  # The Go module cache of the test job is not needed here.
  cache: []
  rules:
    # main only: nothing is deployed from develop, so its images were built for nobody. A merge request can
    # still build them by hand (the play button).
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # The default builder cannot build for two platforms at once; a BuildKit container can.
    # In Docker-in-Docker the connection comes from TLS environment variables, which buildx only
    # accepts through a named context.
    - docker context create tls-environment
    - docker buildx create --use --driver docker-container tls-environment
  script:
    - |
      set -eu
      tags="$CI_COMMIT_SHORT_SHA $CI_COMMIT_REF_SLUG"
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then tags="$tags latest"; fi
      for svc in platform social realtime; do
        image_tags=""
        migrate_tags=""
        for tag in $tags; do
          image_tags="$image_tags -t $CI_REGISTRY_IMAGE/$svc:$tag"
          migrate_tags="$migrate_tags -t $CI_REGISTRY_IMAGE/$svc-migrate:$tag"
        done
        echo "== $svc: $tags"
        docker buildx build --platform "$PLATFORMS" -f "services/$svc/Dockerfile" --build-arg "VERSION=$CI_COMMIT_SHA" $image_tags --push .
        docker buildx build --platform "$PLATFORMS" -f deploy/migrate/Dockerfile --build-arg "SERVICE=$svc" $migrate_tags --push .
      done

# Deploys this commit's images to the k3s server with deploy/deploy.sh (helm upgrade on the server,
# image tag = $CI_COMMIT_SHORT_SHA, the tag the "images" job just pushed). Only main deploys, by
# itself after every merge: develop is for integrating work, main is what runs on the server.
# GitLab lists every deploy under Operate -> Environments -> production, where an older one can be
# deployed again (a rollback).
#
# Needs these CI/CD variables (Settings -> CI/CD -> Variables), all "Protected", so only pipelines
# of protected branches (main) can read them, and the base64 ones "Masked". How to create
# them: deploy/helm/clan/README.md, "Deploy from CI".
#   DEPLOY_SSH_KEY_B64       the CI's own SSH private key, base64 in one line
#   DEPLOY_SSH_KNOWN_HOSTS   the server's host key (from ssh-keyscan), so CI cannot be fooled
#   DEPLOY_SECRETS_B64       deploy/helm/clan/secrets.prod.yaml, base64
#   DEPLOY_JWT_PRIVATE_B64   secrets/prod/platform_jwt_private.pem, base64
#   DEPLOY_JWT_PUBLIC_B64    secrets/prod/platform_jwt_public.pem, base64
deploy:
  stage: deploy
  image: alpine:3.20
  # Runs only after this commit's images were pushed.
  needs: [images]
  cache: []
  # One deploy at a time; a second one waits for the first.
  resource_group: production
  environment:
    name: production
    url: https://platform.130-61-158-79.sslip.io/health
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    DEPLOY_SECRETS: .deploy/secrets.yaml
    DEPLOY_JWT_PRIVATE: .deploy/platform_jwt_private.pem
    DEPLOY_JWT_PUBLIC: .deploy/platform_jwt_public.pem
  before_script:
    - apk add --no-cache bash openssh-client
    # Files readable only by this job's user. The values never appear in the log.
    - umask 077
    - mkdir -p ~/.ssh .deploy
    - echo "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - echo "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - echo "$DEPLOY_SECRETS_B64" | base64 -d > "$DEPLOY_SECRETS"
    - echo "$DEPLOY_JWT_PRIVATE_B64" | base64 -d > "$DEPLOY_JWT_PRIVATE"
    - echo "$DEPLOY_JWT_PUBLIC_B64" | base64 -d > "$DEPLOY_JWT_PUBLIC"
  script:
    - bash deploy/deploy.sh "$CI_COMMIT_SHORT_SHA"
  after_script:
    - rm -rf .deploy ~/.ssh/id_ed25519
