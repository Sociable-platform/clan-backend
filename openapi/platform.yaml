openapi: 3.0.3
info:
  title: Platform service
  version: 0.1.0
  description: |
    Developers, registered games, API keys and player tokens.

    Conventions for every endpoint:
    - Errors always use the `Error` shape: `{ "error": { "code": "...", "message": "..." } }`.
    - Browser calls are only accepted from the origins in `PLATFORM_CORS_ORIGINS`
      (default `http://localhost:5173`, the dashboard). Other origins get 403 `origin_not_allowed`.
      Calls without an `Origin` header (the game's own server, curl) are not affected.

    This file lists only implemented routes. `TestOpenAPIMatchesRoutes` fails when it
    and `services/platform/internal/handler` drift apart.
servers:
  - url: http://localhost:8081
    description: Local (docker compose or go run)
tags:
  - name: system
    description: Health checks
  - name: developers
    description: Developer accounts for the dashboard
  - name: games
    description: Existing games a developer has registered with the toolkit
  - name: api-keys
    description: Secret keys a game's own server uses to get player tokens
  - name: widget
    description: The clan widget's look, edited as a draft in the dashboard
  - name: players
    description: Player tokens, issued to a game's own server
paths:
  /health:
    get:
      tags: [system]
      operationId: health
      summary: The process is running
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example:
                status: ok
                service: platform
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /ready:
    get:
      tags: [system]
      operationId: ready
      summary: The service can reach its database
      responses:
        "200":
          description: The database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example:
                status: ready
                service: platform
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/developers/register:
    post:
      tags: [developers]
      operationId: registerDeveloper
      summary: Create a developer account
      description: |
        The email is trimmed and lowercased; two accounts cannot share an email.
        Password: 8 to 72 characters (bcrypt limit). Name: 1 to 100 characters.
        Registering does not log the developer in; call login next.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: dev@example.com
              password: correct horse
              name: Dev One
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
              example:
                id: 6f1c1d1e-8a43-4d0e-9d57-0c2f0b1f6a10
                email: dev@example.com
                name: Dev One
                createdAt: "2026-11-06T10:00:00Z"
        "400":
          description: |
            Invalid input. `code` is `invalid_email`, `invalid_password`, `invalid_name`
            or `invalid_json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_email
                  message: Email address is not valid
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "409":
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: email_taken
                  message: An account with this email already exists
  /api/v1/developers/login:
    post:
      tags: [developers]
      operationId: loginDeveloper
      summary: Log in and get a developer token
      description: |
        Send the token as `Authorization: Bearer <token>` on developer endpoints.
        An unknown email and a wrong password give the same 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: dev@example.com
              password: correct horse
      responses:
        "200":
          description: Logged in. The response is not cacheable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                expiresIn: 86400
        "400":
          description: The body is not valid JSON (`invalid_json`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_json
                  message: Request body must contain a single JSON object
        "401":
          description: Email or password is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is wrong
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /api/v1/developers/me:
    get:
      tags: [developers]
      operationId: getCurrentDeveloper
      summary: The logged-in developer
      description: Accepts only a developer token. Player tokens and API keys are rejected.
      security:
        - developerToken: []
      responses:
        "200":
          description: The developer behind the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
              example:
                id: 6f1c1d1e-8a43-4d0e-9d57-0c2f0b1f6a10
                email: dev@example.com
                name: Dev One
                createdAt: "2026-11-06T10:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /api/v1/games:
    get:
      tags: [games]
      operationId: listGames
      summary: List my games
      description: Returns only the games registered by the logged-in developer, newest first.
      security:
        - developerToken: []
      responses:
        "200":
          description: The developer's games. An empty list when there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameList"
              example:
                games:
                  - id: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                    name: Space Raiders
                    description: Browser shooter, 2 to 4 players
                    createdAt: "2026-11-07T09:30:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
    post:
      tags: [games]
      operationId: registerGame
      summary: Register an existing game
      description: |
        Records an integration for a game the developer already has. This never creates a game.
        The game belongs to the logged-in developer.
      security:
        - developerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterGameRequest"
            example:
              name: Space Raiders
              description: Browser shooter, 2 to 4 players
      responses:
        "201":
          description: Game registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
              example:
                id: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                name: Space Raiders
                description: Browser shooter, 2 to 4 players
                createdAt: "2026-11-07T09:30:00Z"
        "400":
          description: |
            Invalid input. `code` is `invalid_name`, `invalid_description` or `invalid_json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_name
                  message: Game name must be 1 to 100 characters
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /api/v1/games/{gameID}/api-keys:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: List a game's API keys
      description: |
        Active and revoked keys, newest first. Only the prefix is shown, never the full key.
        Only the game's owner can list its keys; for anyone else the game does not exist (404).
      security:
        - developerToken: []
      responses:
        "200":
          description: The game's keys. An empty list when there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
              example:
                apiKeys:
                  - id: 3b1c6f0e-9d2a-4a53-8f0b-7a9d2f6c1e44
                    gameId: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                    keyPrefix: clk_Ab3x
                    createdAt: "2026-11-07T10:00:00Z"
                    revokedAt: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/GameNotFound"
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: Create an API key
      description: |
        Generates a random key. **The full key is in this response only**; the database keeps
        just a hash, so it cannot be shown again. Keep it on the game's own server, never in
        browser code. No request body.
      security:
        - developerToken: []
      responses:
        "201":
          description: Key created. The response is not cacheable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewApiKey"
              example:
                id: 3b1c6f0e-9d2a-4a53-8f0b-7a9d2f6c1e44
                gameId: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                keyPrefix: clk_Ab3x
                createdAt: "2026-11-07T10:00:00Z"
                revokedAt: null
                key: clk_Ab3xQ0m7w2n5v8k1p4s9d6f3g0h7j2l5z8c1x4b7n0m
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/GameNotFound"
  /api/v1/games/{gameID}/widget/draft:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      tags: [widget]
      operationId: getWidgetDraft
      summary: Get a game's widget draft
      description: |
        The config the developer is editing. When nothing was saved yet it returns the default
        config and `updatedAt` is null. Players never see drafts, only published versions.
        Only the game's owner can read it; for anyone else the game does not exist (404).
      security:
        - developerToken: []
      responses:
        "200":
          description: The current draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetDraft"
              example:
                config:
                  schemaVersion: 1
                updatedAt: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/GameNotFound"
    put:
      tags: [widget]
      operationId: saveWidgetDraft
      summary: Save a game's widget draft
      description: |
        Replaces the whole draft with the config in the body. The config must be a JSON object
        of at most 64 KB. Only the game's owner can save it; for anyone else the game does not
        exist (404).
      security:
        - developerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveWidgetDraftRequest"
            example:
              config:
                schemaVersion: 1
                theme:
                  accent: "#8B65EE"
      responses:
        "200":
          description: The saved draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetDraft"
              example:
                config:
                  schemaVersion: 1
                  theme:
                    accent: "#8B65EE"
                updatedAt: "2026-11-08T12:00:00Z"
        "400":
          description: |
            Invalid input. `code` is `invalid_widget_config` (not a JSON object, or too large)
            or `invalid_json` (the request body itself is not valid JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_widget_config
                  message: Config must be a JSON object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/GameNotFound"
  /api/v1/api-keys/{keyID}:
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: |
        The key stops working immediately and stays in the list marked revoked.
        Revoking an already revoked key succeeds. Only the owner of the key's game can revoke it;
        for anyone else the key does not exist (404).
      security:
        - developerToken: []
      parameters:
        - name: keyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Key revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: No such key, or it belongs to another developer's game.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: api_key_not_found
                  message: API key not found
  /api/v1/players/auth:
    post:
      tags: [players]
      operationId: authPlayer
      summary: Get a player token
      description: |
        Called by the **game's own server**, never by a browser: the API key must stay secret.
        The game has already logged its player in with its own account system; this call
        vouches for that player and returns a short-lived token for the browser and the SDK.

        The token is an Ed25519 JWT (`typ` "player") with the claims `sub` (the game's player ID),
        `gid` (the game the API key belongs to), `name` (display name), `iat` and `exp`.
        It is valid for 1 hour. The game cannot be chosen in the body: it is always the key's game.
        Social checks the token with platform's public key and never calls platform.

        The key is checked before the body, so a wrong key gets 401 whatever the body holds.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerAuthRequest"
            example:
              externalPlayerId: u_42
              displayName: Rashad
      responses:
        "200":
          description: Token issued. The response is not cacheable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerAuthResponse"
              example:
                token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                expiresIn: 3600
        "400":
          description: |
            Invalid input. `code` is `invalid_external_player_id`, `invalid_display_name`
            or `invalid_json` (also for unknown fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_display_name
                  message: displayName must be 1 to 50 characters without control characters
        "401":
          description: The `X-API-Key` header is missing, or the key is wrong or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_api_key
                  message: API key is missing, wrong or revoked
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
components:
  parameters:
    GameID:
      name: gameID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    developerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Developer token (typ "developer") returned by login. Used by the dashboard.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Secret API key of a game. Only the game's own server sends it, never a browser.
  schemas:
    Status:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok, ready]
        service:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        name:
          type: string
          minLength: 1
          maxLength: 100
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [token, expiresIn]
      properties:
        token:
          type: string
          description: Developer JWT (`typ` "developer", Ed25519).
        expiresIn:
          type: integer
          description: Seconds until the token expires.
    Developer:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    RegisterGameRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
    Game:
      type: object
      required: [id, name, description, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          description: Empty string when none was given.
        createdAt:
          type: string
          format: date-time
    GameList:
      type: object
      required: [games]
      properties:
        games:
          type: array
          items:
            $ref: "#/components/schemas/Game"
    ApiKey:
      type: object
      required: [id, gameId, keyPrefix, createdAt, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        keyPrefix:
          type: string
          description: First 8 characters of the key (`clk_` and 4 more), to recognise it.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: When the key was revoked; null while it is active.
    NewApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The full secret key. Returned only by the create call and never stored.
    ApiKeyList:
      type: object
      required: [apiKeys]
      properties:
        apiKeys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    SaveWidgetDraftRequest:
      type: object
      required: [config]
      properties:
        config:
          type: object
          description: The widget config. Any JSON object up to 64 KB; its fields are defined by the config contract.
          additionalProperties: true
    WidgetDraft:
      type: object
      required: [config, updatedAt]
      properties:
        config:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the draft was last saved. Null while nothing was saved and `config` is the default.
    PlayerAuthRequest:
      type: object
      required: [externalPlayerId, displayName]
      additionalProperties: false
      properties:
        externalPlayerId:
          type: string
          minLength: 1
          maxLength: 128
          description: The game's own ID for the player. Surrounding spaces are trimmed.
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: Name shown to other players. Surrounding spaces are trimmed.
    PlayerAuthResponse:
      type: object
      required: [token, expiresIn]
      properties:
        token:
          type: string
          description: Player JWT (`typ` "player", Ed25519). Hand it to the game's frontend.
        expiresIn:
          type: integer
          description: Seconds until the token expires (3600).
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable code, e.g. not_found, invalid_json, not_ready.
            message:
              type: string
              description: Human-readable explanation.
  responses:
    GameNotFound:
      description: No such game, or it belongs to another developer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: game_not_found
              message: Game not found
    Unauthorized:
      description: The developer token is missing, malformed, expired, of the wrong type, or its account no longer exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: A valid developer token is required
    NotFound:
      description: No such route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Route not found
    OriginNotAllowed:
      description: The request came from a website that is not in the allowed origins.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: origin_not_allowed
              message: This website is not allowed to call the API
    NotReady:
      description: The database is not reachable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_ready
              message: Database is not reachable
