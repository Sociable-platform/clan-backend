openapi: 3.0.3
info:
  title: Platform service
  version: 0.1.0
  description: |
    Developers, registered games, API keys and player tokens, plus the admin panel's login.

    Conventions for every endpoint:
    - Errors always use the `Error` shape: `{ "error": { "code": "...", "message": "..." } }`.
    - Browser calls are only accepted from the origins in `PLATFORM_CORS_ORIGINS`
      (default `http://localhost:5173`, the dashboard). Other origins get 403 `origin_not_allowed`.
      Calls without an `Origin` header (the game's own server, curl) are not affected.
      The one exception is `GET /api/v1/public/...`: it is open to every website (`Access-Control-Allow-Origin: *`).

    This file lists only implemented routes. `TestOpenAPIMatchesRoutes` fails when it
    and `services/platform/internal/handler` drift apart.
servers:
  - url: http://localhost:8081
    description: Local (docker compose or go run)
tags:
  - name: system
    description: Health checks
  - name: developers
    description: Developer accounts for the dashboard
  - name: admin
    description: The distributor's admin panel (admin token only; there is no way to register as an admin)
  - name: games
    description: Existing games a developer has registered with the toolkit
  - name: invites
    description: Inviting developers to a game by email, and answering an invitation
  - name: api-keys
    description: Secret keys a game's own server uses to get player tokens
  - name: internal
    description: Routes for other services (realtime), guarded by a shared secret; never for browsers
  - name: widget
    description: The clan widget's look, edited as a draft in the dashboard
  - name: players
    description: Player tokens, issued to a game's own server
  - name: public
    description: Read-only routes for a game's page in the player's browser; no login, open to every website
x-valid-widget-config: &validConfig
  schemaVersion: 1
  game_id: b21d94e7-3c0a-4f68-8e15-a9d7c4f02b61
  theme:
    mode: light
    fonts:
      heading: { family: Fredoka, source: google }
      body: { family: Nunito, source: google }
    frame: { style: none, width: 1, color: "#D9DBD5", corners: round }
    buttons: { style: outline, case: normal }
    panel: { opacity: 0.9, blur: true }
    colors:
      brand: "#2E8B57"
      background: "#FFFFFF"
      surface: "#F2F3F1"
      text: "#000000"
      muted: "#5B5D56"
    textures: {}
  layout: { position: bottom-left, startCollapsed: false }
  friends: { enabled: true }
  clan:
    enabled: false
    maxMembers: 10
    descriptionMax: 140
    badges: { source: developer, allowed: [] }
    screens:
      discover: { enabled: false }
      create: { enabled: false }
      home: { enabled: false, header: compact, showStats: false }
      members: { enabled: false }
  chat:
    enabled: true
    layout: bubbles
    directMessages: true
    clanChat: false
    maxMessageLength: 500
    slowModeSeconds: 0
    profanityFilter: false
    historyLimit: 50
  texts:
    terms: { clan: Clan, clans: Clans }
    labels: {}
paths:
  /health:
    get:
      tags: [system]
      operationId: health
      summary: The process is running
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example:
                status: ok
                service: platform
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /ready:
    get:
      tags: [system]
      operationId: ready
      summary: The service can reach its database
      responses:
        "200":
          description: The database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
              example:
                status: ready
                service: platform
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "503":
          $ref: "#/components/responses/NotReady"
  /api/v1/developers/register:
    post:
      tags: [developers]
      operationId: registerDeveloper
      summary: Create a developer account
      description: |
        The email is trimmed and lowercased; two accounts cannot share an email.
        Password: 8 to 72 characters (bcrypt limit). Name: 1 to 100 characters.
        Registering does not log the developer in; call login next.

        **With email verification on** (`PLATFORM_EMAIL_VERIFICATION`) this does not create the account.
        It answers 202, emails a 6-digit code to the address, and the account is created by
        `register/verify` with that code. The 202 is the same when the email already has an account
        (that address is told by email instead), so there is no 409 then. Limited to 5 requests per
        email and 20 per IP address in 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: dev@example.com
              password: correct horse
              name: Dev One
      responses:
        "201":
          description: Account created (email verification off).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
              example:
                id: 6f1c1d1e-8a43-4d0e-9d57-0c2f0b1f6a10
                email: dev@example.com
                name: Dev One
                createdAt: "2026-11-06T10:00:00Z"
                status: active
                statusReason: null
        "202":
          description: Email verification is on. Nothing is created yet; a code was emailed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: We sent a code to this email address. Enter it to finish registering.
        "429":
          $ref: "#/components/responses/RateLimited"
        "400":
          description: |
            Invalid input. `code` is `invalid_email`, `invalid_password`, `invalid_name`
            or `invalid_json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_email
                  message: Email address is not valid
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "409":
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: email_taken
                  message: An account with this email already exists
  /api/v1/developers/register/verify:
    post:
      tags: [developers]
      operationId: verifyRegistration
      summary: Finish registering with the code from the email
      description: |
        Only with email verification on (`PLATFORM_EMAIL_VERIFICATION`); otherwise 404.

        `code` is the 6-digit code that `register` emailed to `email`. With the right code the
        developer is created and returned, exactly like `register` does without verification; call
        login next. The code works once and for 15 minutes.

        A wrong code, an expired one and an email nobody registered all answer 400
        `invalid_verification_code`. The fifth wrong code cancels the registration
        (`verification_attempts_exceeded`); the developer registers again for a new code.
        Limited to 60 requests per IP address in 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRegistrationRequest"
            example:
              email: dev@example.com
              code: "482913"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
              example:
                id: 6f1c1d1e-8a43-4d0e-9d57-0c2f0b1f6a10
                email: dev@example.com
                name: Dev One
                createdAt: "2026-11-06T10:00:00Z"
                status: active
                statusReason: null
        "400":
          description: |
            The body is not valid JSON (`invalid_json`), the code is wrong or expired
            (`invalid_verification_code`), or it was wrong too often and the registration is
            cancelled (`verification_attempts_exceeded`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_verification_code
                  message: The code is wrong or has expired.
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: Email verification is off (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_found
                  message: Route not found
        "409":
          description: An account with this email was created in the meantime (`email_taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: email_taken
                  message: An account with this email already exists
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/developers/register/resend:
    post:
      tags: [developers]
      operationId: resendRegistrationCode
      summary: Email a new code for a registration that is waiting
      description: |
        Only with email verification on (`PLATFORM_EMAIL_VERIFICATION`); otherwise 404.

        Sends a new 6-digit code; the earlier code stops working and the count of wrong codes starts
        again. The answer is the same 202 whether or not a registration is waiting for this email.
        At most one email a minute per registration, and 5 per email (together with `register`) and
        20 per IP address in 15 minutes; over that it answers 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
            example:
              email: dev@example.com
      responses:
        "202":
          description: Accepted. If a registration is waiting for the email, a new code is on its way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: If a registration is waiting for this email address, a new code has been sent to it.
        "400":
          description: The body is not valid JSON (`invalid_json`) or the email is not an email address (`invalid_email`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_email
                  message: Email address is not valid
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: Email verification is off (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: not_found
                  message: Route not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/developers/login:
    post:
      tags: [developers]
      operationId: loginDeveloper
      summary: Log in and get a developer token
      description: |
        Send the token as `Authorization: Bearer <token>` on developer endpoints.
        An unknown email and a wrong password give the same 401.

        Login also starts a session: the answer sets the `clan_refresh` cookie (HttpOnly, 7 days) with
        the session's refresh token. When the developer token has expired, `token/refresh` gives a new
        one for that cookie, and `logout` ends the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: dev@example.com
              password: correct horse
      responses:
        "200":
          description: Logged in. The refresh token is in `Set-Cookie`. The response is not cacheable.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "`clan_refresh=<token>; Path=/api/v1/developers; Max-Age=604800; HttpOnly; Secure; SameSite=Lax`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                expiresIn: 900
        "400":
          description: The body is not valid JSON (`invalid_json`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_json
                  message: Request body must contain a single JSON object
        "401":
          description: Email or password is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is wrong
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /api/v1/developers/password-reset:
    post:
      tags: [developers]
      operationId: requestPasswordReset
      summary: Ask for a link to reset a forgotten password
      description: |
        Emails a link to the dashboard's reset page (`<dashboard>/reset-password#token=<token>`) to the
        developer with this email. The link works once and for 30 minutes; asking again replaces it.

        The answer is the same 202 whether or not an account with this email exists, so this endpoint
        does not tell who is registered. Limited to 3 requests per email and 20 per IP address in
        15 minutes; over that it answers 429 with `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
            example:
              email: dev@example.com
      responses:
        "202":
          description: Accepted. If the email belongs to an account, the link is on its way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: If an account with this email exists, a link to reset the password has been sent to it.
        "400":
          description: The body is not valid JSON (`invalid_json`) or the email is not an email address (`invalid_email`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_email
                  message: Email address is not valid
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/developers/password-reset/confirm:
    post:
      tags: [developers]
      operationId: confirmPasswordReset
      summary: Set a new password with the token from the reset link
      description: |
        `token` is the part after `#token=` in the emailed link. On success the password is changed,
        the link stops working, and every developer token issued before is refused (401), so whoever
        was logged in with the old password is logged out. The developer then logs in as usual.

        The new password follows the rules of registration. A password that breaks them does not use
        the link up. Limited to 20 requests per IP address in 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
            example:
              token: 3q2-7wEjYc0Vq8nG5sX1uZk4hTtB9aLmRrPdOoWfN6I
              password: a brand new one
      responses:
        "204":
          description: The password is changed.
        "400":
          description: |
            The body is not valid JSON (`invalid_json`), the password is too short or too long
            (`invalid_password`), or the token is unknown, already used or expired (`invalid_reset_token`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_reset_token
                  message: This reset link is not valid or has expired. Ask for a new one.
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/developers/token/refresh:
    post:
      tags: [developers]
      operationId: refreshDeveloperToken
      summary: Get a new developer token with the refresh cookie
      description: |
        The request has no body and no `Authorization` header: the `clan_refresh` cookie, set by login,
        is the credential. A browser must send it (`credentials: "include"`).

        The answer is a new developer token and a new cookie. The refresh token that was sent stops
        working (rotation), and the new one is valid for 7 days again, so a developer who keeps using
        the dashboard stays logged in.

        401 `invalid_refresh_token` means the session is over and the developer must log in: no cookie,
        an unknown or expired token, a session that was logged out or ended by a password reset, or a
        token that had already been replaced. In that last case someone is using a copy, so the whole
        session is ended. (A token replaced within the last 10 seconds is still accepted: the same
        refresh arriving twice.) The 401 also clears the cookie.

        Works while the account is suspended. Limited to 300 requests per IP address in 15 minutes,
        together with logout.
      security:
        - refreshCookie: []
      responses:
        "200":
          description: A new developer token; the new refresh token is in `Set-Cookie`. Not cacheable.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "`clan_refresh=<token>; Path=/api/v1/developers; Max-Age=604800; HttpOnly; Secure; SameSite=Lax`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                expiresIn: 900
        "401":
          description: The session is over (`invalid_refresh_token`). The cookie is cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_refresh_token
                  message: Your session has ended. Log in again.
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/developers/logout:
    post:
      tags: [developers]
      operationId: logoutDeveloper
      summary: End the session of the refresh cookie
      description: |
        Deletes every refresh token of the session the `clan_refresh` cookie belongs to and clears the
        cookie, so no new developer token can be had for that login. Other logins of the same developer
        (another browser, another computer) are not touched.

        The developer token already issued stays valid until it expires; the dashboard forgets it.
        Answers 204 with or without a session, so logging out twice is fine.
      security:
        - refreshCookie: []
        - {}
      responses:
        "204":
          description: Logged out. The cookie is cleared.
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/developers/me:
    get:
      tags: [developers]
      operationId: getCurrentDeveloper
      summary: The logged-in developer
      description: |
        Accepts only a developer token. Player tokens and API keys are rejected. Works while the
        account is suspended: `status` is `suspended` and `statusReason` says why, so the dashboard can
        show a banner and disable its write buttons.
      security:
        - developerToken: []
      responses:
        "200":
          description: The developer behind the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
              example:
                id: 6f1c1d1e-8a43-4d0e-9d57-0c2f0b1f6a10
                email: dev@example.com
                name: Dev One
                createdAt: "2026-11-06T10:00:00Z"
                status: active
                statusReason: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /api/v1/admin/login:
    post:
      tags: [admin]
      operationId: loginAdmin
      summary: Log in as an admin and get an admin token
      description: |
        Send the token as `Authorization: Bearer <token>` on `/api/v1/admin/` endpoints. It lasts
        `PLATFORM_ADMIN_TOKEN_TTL` (default 1 hour). An unknown email, a wrong password and a disabled
        admin all give the same 401. Admins cannot register through the API; the first one is created
        with `go run ./tools/createadmin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: ops@example.com
              password: correct horse
      responses:
        "200":
          description: Logged in. The response is not cacheable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
              example:
                token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                expiresIn: 3600
        "400":
          description: The body is not valid JSON (`invalid_json`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_json
                  message: Request body must contain a single JSON object
        "401":
          description: Email or password is wrong, or the admin is disabled (`invalid_credentials`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is wrong
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /api/v1/admin/me:
    get:
      tags: [admin]
      operationId: getCurrentAdmin
      summary: The signed-in admin
      description: |
        Accepts only an admin token. Developer tokens, player tokens and API keys are rejected, and so
        is the token of an admin who has been disabled since it was issued.
      security:
        - adminToken: []
      responses:
        "200":
          description: The admin behind the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
              example:
                id: 0b7f6c52-3f64-4a53-b0a9-6d3c1c3f2a11
                email: ops@example.com
                name: Ops One
                createdAt: "2026-11-12T09:00:00Z"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /api/v1/admin/developers:
    get:
      tags: [admin]
      operationId: listAdminDevelopers
      summary: List developers
      description: |
        Every developer, newest first, for the admin panel. Pages are cursor based: pass the
        `nextCursor` of a page as `cursor` to get the next one; it is `null` on the last page. A cursor
        is opaque and only valid for the same `q` and `status`. Returns developer emails across all
        tenants, so it accepts only an admin token.
      security:
        - adminToken: []
      parameters:
        - name: q
          in: query
          description: Part of the email or name, matched without regard to case. At most 100 characters.
          schema:
            type: string
        - name: status
          in: query
          description: Only developers with this status.
          schema:
            type: string
            enum: [active, suspended]
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: A page of developers. An empty list when none match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeveloperList"
              example:
                developers:
                  - id: 6f1c1d1e-8a43-4d0e-9d57-0c2f0b1f6a10
                    email: dev@example.com
                    name: Dev One
                    status: suspended
                    gameCount: 2
                    createdAt: "2026-11-06T10:00:00Z"
                nextCursor: eyJ0IjoiMjAyNi0xMS0wNlQxMDowMDowMFoiLCJpZCI6IjZmMWMxZDFlLThhNDMtNGQwZS05ZDU3LTBjMmYwYjFmNmExMCJ9
        "400":
          description: The `limit`, `status`, `q` or `cursor` is not valid (`invalid_limit`, `invalid_status`, `invalid_query`, `invalid_cursor`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_cursor
                  message: Cursor is not valid
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /api/v1/admin/developers/{developerID}:
    get:
      tags: [admin]
      operationId: getAdminDeveloper
      summary: One developer with their games
      description: The developer and every game they own, each with its status and reason. A malformed ID and an unknown developer give the same 404.
      security:
        - adminToken: []
      parameters:
        - name: developerID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The developer and their games, newest game first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeveloper"
              example:
                id: 6f1c1d1e-8a43-4d0e-9d57-0c2f0b1f6a10
                email: dev@example.com
                name: Dev One
                status: active
                statusReason: null
                statusChangedAt: null
                createdAt: "2026-11-06T10:00:00Z"
                games:
                  - id: 3b0f1f0e-7c1d-4e53-9d2a-5b8e6a7c9d10
                    name: Farm Friends
                    description: Cozy farming game
                    status: suspended
                    statusReason: abuse
                    statusChangedAt: "2026-11-12T12:00:00Z"
                    createdAt: "2026-11-07T08:30:00Z"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: No such developer (`developer_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: developer_not_found
                  message: Developer not found
  /api/v1/admin/developers/{developerID}/status:
    put:
      tags: [admin]
      operationId: setDeveloperStatus
      summary: Suspend or resume a developer
      description: |
        Switches a developer's access off or on. One switch turns off every game the developer owns:
        their games keep their own status, and a game is served only when it and its developer are both
        `active`. Nothing is deleted.

        The status change and its audit-log entry are written together or not at all. Setting the status
        the developer already has is not an error: it changes nothing and writes no audit entry.
        `reason` (`non_payment`, `abuse`, `other`) is required when suspending; when resuming it may be
        left out and the audit entry records the reason of the suspension that ended. `note` (at most
        1000 characters) is internal: it is stored in the audit log only and no developer route returns it.
      security:
        - adminToken: []
      parameters:
        - name: developerID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusRequest"
            examples:
              suspend:
                summary: Suspend for non-payment
                value:
                  status: suspended
                  reason: non_payment
                  note: Invoice 1042 unpaid after two reminders
              resume:
                summary: Resume (no reason needed)
                value:
                  status: active
      responses:
        "200":
          description: The status after the call, whether or not it changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeveloper"
              example:
                id: 6f1c1d1e-8a43-4d0e-9d57-0c2f0b1f6a10
                email: dev@example.com
                name: Dev One
                status: suspended
                statusReason: non_payment
                statusChangedAt: "2026-11-12T12:00:00Z"
                createdAt: "2026-11-06T10:00:00Z"
                games:
                  - id: 3b0f1f0e-7c1d-4e53-9d2a-5b8e6a7c9d10
                    name: Farm Friends
                    description: Cozy farming game
                    status: active
                    statusReason: null
                    statusChangedAt: null
                    createdAt: "2026-11-07T08:30:00Z"
        "400":
          description: |
            The body is not valid JSON (`invalid_json`), or a field is not valid: `invalid_status`,
            `reason_required` (suspending without a reason), `invalid_reason`, `invalid_note`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: reason_required
                  message: "A reason is required when suspending: non_payment, abuse or other"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: No such developer (`developer_not_found`); a malformed ID gives the same answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: developer_not_found
                  message: Developer not found
  /api/v1/admin/games/{gameID}:
    get:
      tags: [admin]
      operationId: getAdminGame
      summary: One game with the developers on it
      description: |
        The game and everybody who belongs to it, owners first, each with the status of their account. A game is
        served while its own switch is on and at least one owner's account is active, so this shows why a game is off.
      security:
        - adminToken: []
      parameters:
        - name: gameID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The game with its team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGameDetail"
              example:
                id: 3b0f1f0e-7c1d-4e53-9d2a-5b8e6a7c9d10
                name: Farm Friends
                description: Cozy farming game
                status: active
                statusReason: null
                statusChangedAt: null
                createdAt: "2026-11-07T08:30:00Z"
                members:
                  - developerId: 7f1e0c2a-5b3d-4e8f-9a10-2b3c4d5e6f70
                    name: Ali
                    email: ali@example.com
                    role: owner
                    status: active
                    joinedAt: "2026-11-07T08:30:00Z"
                  - developerId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    name: Emma
                    email: emma@example.com
                    role: member
                    status: suspended
                    joinedAt: "2026-11-09T12:00:00Z"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: No such game (`game_not_found`); a malformed ID gives the same answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: game_not_found
                  message: Game not found
  /api/v1/admin/games/{gameID}/team-log:
    get:
      tags: [admin]
      operationId: listAdminTeamLog
      summary: Who changed a game's team
      description: |
        The history of a game's team, newest first, a page at a time: every invitation sent, cancelled, accepted or
        declined, every removal, leaving, role change and hand-over, each with who did it (`actor`) and to whom
        (`subject`). Each row is written in the same transaction as the change it records, so a change that happened
        always has its row, and a refused or rolled-back change has none. A role somebody has already is not a change
        and is not recorded. An owner who removes themselves is recorded as `member_left`.

        An invitation is for an address, so its `subject` has the address and, until the person has an account, no
        `developerId` and no name (`invite_sent`, `invite_cancelled`); `invite_accepted` and `invite_declined` have the
        developer who answered as `actor`.
      security:
        - adminToken: []
      parameters:
        - name: gameID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: A page of the history. An empty list for a game whose team never changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamLogPage"
              example:
                entries:
                  - id: 8c1f5e2a-3b4d-4c6e-9a7b-1d2e3f4a5b6c
                    action: role_changed
                    actor: { developerId: 7f1e0c2a-5b3d-4e8f-9a10-2b3c4d5e6f70, name: Ali, email: ali@example.com }
                    subject: { developerId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, name: Emma, email: emma@example.com }
                    role: owner
                    createdAt: "2026-11-17T11:00:00Z"
                  - id: 2d3e4f5a-6b7c-4d8e-9f01-a2b3c4d5e6f7
                    action: invite_sent
                    actor: { developerId: 7f1e0c2a-5b3d-4e8f-9a10-2b3c4d5e6f70, name: Ali, email: ali@example.com }
                    subject: { developerId: null, name: "", email: carol@example.com }
                    role: null
                    createdAt: "2026-11-17T10:00:00Z"
                nextCursor: null
        "400":
          description: '`invalid_limit` or `invalid_cursor`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_limit
                  message: Limit must be 1 to 100
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: No such game (`game_not_found`); a malformed ID gives the same answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: game_not_found
                  message: Game not found
  /api/v1/admin/games/{gameID}/status:
    put:
      tags: [admin]
      operationId: setGameStatus
      summary: Suspend or resume a game
      description: |
        Switches one game off or on while the developer's other games keep working. Same rules as
        `PUT /api/v1/admin/developers/{developerID}/status`: the change and its audit-log entry are written
        together, setting the current status changes nothing, `reason` is required when suspending, and
        `note` is internal.
      security:
        - adminToken: []
      parameters:
        - name: gameID
          in: path
