                error:
                  code: game_not_found
                  message: Game not found
  /api/v1/admin/audit-log:
    get:
      tags: [admin]
      operationId: listAdminAuditLog
      summary: Read the audit log
      description: |
        Every change of access, newest first. With `targetId` only the entries about that developer or
        game. Paged like the developer list. `note` is internal text for admins and is never shown to
        the developer.
      security:
        - adminToken: []
      parameters:
        - name: targetId
          in: query
          description: A developer or game ID.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: A page of entries. An empty list when there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
              example:
                entries:
                  - id: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
                    actor: 0b7f6c52-3f64-4a53-b0a9-6d3c1c3f2a11
                    action: developer.suspended
                    targetType: developer
                    targetId: 6f1c1d1e-8a43-4d0e-9d57-0c2f0b1f6a10
                    reason: non_payment
                    note: Invoice 1042 unpaid after two reminders
                    createdAt: "2026-11-12T12:00:00Z"
                nextCursor: null
        "400":
          description: The `limit`, `targetId` or `cursor` is not valid (`invalid_limit`, `invalid_target_id`, `invalid_cursor`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_target_id
                  message: targetId must be a UUID
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
  /api/v1/games:
    get:
      tags: [games]
      operationId: listGames
      summary: List my games
      description: Returns only the games registered by the logged-in developer, newest first.
      security:
        - developerToken: []
      responses:
        "200":
          description: The developer's games. An empty list when there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameList"
              example:
                games:
                  - id: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                    name: Space Raiders
                    description: Browser shooter, 2 to 4 players
                    allowedOrigins: ["https://play.example.com"]
                    createdAt: "2026-11-07T09:30:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
    post:
      tags: [games]
      operationId: registerGame
      summary: Register an existing game
      description: |
        Records an integration for a game the developer already has. This never creates a game.
        The game belongs to the logged-in developer.
      security:
        - developerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterGameRequest"
            example:
              name: Space Raiders
              description: Browser shooter, 2 to 4 players
      responses:
        "201":
          description: Game registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
              example:
                id: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                name: Space Raiders
                description: Browser shooter, 2 to 4 players
                allowedOrigins: []
                createdAt: "2026-11-07T09:30:00Z"
        "400":
          description: |
            Invalid input. `code` is `invalid_name`, `invalid_description` or `invalid_json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_name
                  message: Game name must be 1 to 100 characters
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrOrigin"
  /api/v1/games/{gameID}/members:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      tags: [games]
      operationId: listGameMembers
      summary: List the developers on a game
      description: |
        Everybody who belongs to the game: its owners first, then its members, each group by when they joined. Any
        member of the game may look (a team knows who is on it); a developer who is not in the game gets 404.
      security:
        - developerToken: []
      responses:
        "200":
          description: The game's team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameMemberList"
              example:
                members:
                  - developerId: 7f1e0c2a-5b3d-4e8f-9a10-2b3c4d5e6f70
                    name: Ali
                    email: ali@example.com
                    role: owner
                    joinedAt: "2026-11-07T09:30:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/GameNotFound"
  /api/v1/games/{gameID}/members/{developerID}:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/DeveloperID"
    delete:
      tags: [games]
      operationId: removeGameMember
      summary: Take a developer off a game
      description: |
        Only an owner can (403 `owner_required` for a member, 404 for a developer who is not on the game). Their access
        stops at once: the next request they make for the game is a 404, whatever their login token says, because the
        membership is looked up on every request. Removing an owner is allowed while another owner is left; the last
        owner is 409 `last_owner`, also when two owners are removed at the same moment (one of the two wins, the other
        gets 409). `developerID` may be the caller's own, which is the same as leaving.
      security:
        - developerToken: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrOwner"
        "404":
          $ref: "#/components/responses/MemberNotFound"
        "409":
          $ref: "#/components/responses/LastOwner"
  /api/v1/games/{gameID}/members/{developerID}/role:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/DeveloperID"
    put:
      tags: [games]
      operationId: setGameMemberRole
      summary: Make a developer an owner or a member
      description: |
        Only an owner can. Promoting a member gives them everything an owner has (API keys, allowed origins, the team);
        demoting an owner makes them a member. Setting the role somebody has already changes nothing and answers 200. A
        game always keeps one owner: demoting the last one is 409 `last_owner`, also under concurrent requests.
        To hand a game over in one step use `POST .../transfer-ownership`.
      security:
        - developerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
            example:
              role: owner
      responses:
        "200":
          description: The developer with their new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameMember"
              example:
                developerId: 7f1e0c2a-5b3d-4e8f-9a10-2b3c4d5e6f70
                name: Emma
                email: emma@example.com
                role: owner
                joinedAt: "2026-11-07T09:30:00Z"
        "400":
          description: '`invalid_role` (anything but `"owner"` or `"member"`) or `invalid_json` (also for unknown fields).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_role
                  message: role must be "owner" or "member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrOwner"
        "404":
          $ref: "#/components/responses/MemberNotFound"
        "409":
          $ref: "#/components/responses/LastOwner"
  /api/v1/games/{gameID}/transfer-ownership:
    parameters:
      - $ref: "#/components/parameters/GameID"
    post:
      tags: [games]
      operationId: transferGameOwnership
      summary: Hand a game to another developer
      description: |
        Only an owner can. In one transaction the target becomes an owner and the caller becomes a member, so the game
        never has fewer owners and cannot be left without one. The target has to be on the game already (404
        `member_not_found`) and not an owner (409 `already_owner`, which includes the caller). The answer is the game as
        the caller now sees it, with `role: member`.
      security:
        - developerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnershipRequest"
            example:
              developerId: 7f1e0c2a-5b3d-4e8f-9a10-2b3c4d5e6f70
      responses:
        "200":
          description: The game, with the caller's new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
              example:
                id: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                role: member
                name: Space Raiders
                description: Browser shooter, 2 to 4 players
                allowedOrigins: []
                createdAt: "2026-11-07T09:30:00Z"
        "400":
          description: '`invalid_json` (also for unknown fields).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_json
                  message: Request body is not valid JSON
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrOwner"
        "404":
          $ref: "#/components/responses/MemberNotFound"
        "409":
          description: The target is an owner already (`already_owner`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: already_owner
                  message: This developer is already an owner of the game
  /api/v1/games/{gameID}/leave:
    parameters:
      - $ref: "#/components/parameters/GameID"
    post:
      tags: [games]
      operationId: leaveGame
      summary: Leave a game
      description: |
        Any member of the game can, whatever their role; no body. An owner can leave only while another owner is left
        (409 `last_owner`: make somebody an owner, or transfer the game, first). Afterwards the game is a 404 for them.
        A suspended developer cannot (`account_suspended`): leaving is a write.
      security:
        - developerToken: []
      responses:
        "204":
          description: Left.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrOrigin"
        "404":
          $ref: "#/components/responses/GameNotFound"
        "409":
          $ref: "#/components/responses/LastOwner"
  /api/v1/games/{gameID}/invites:
    parameters:
      - $ref: "#/components/parameters/GameID"
    post:
      tags: [invites]
      operationId: inviteToGame
      summary: Invite a developer to a game by email
      description: |
        Only the game's owner can invite: a member of the game gets 403 `owner_required`, and a developer who is
        not in it gets 404.

        The invitation is a pending row for the email address; it carries no secret and no link. The person it is
        for sees it in `GET /api/v1/invites` once they are logged in with an account that has that address, and
        the email tells them so: someone with an account logs in, someone without one registers first (which
        confirms the address when email verification is on) and then logs in. Nobody can accept it by holding the
        email, only by being that address. The answer is the same whether or not the address has an account.

        There is one pending invite per game and address: inviting again renews it (a new 7 days) and sends the
        email again. It lasts 7 days and expired ones are removed.

        Sending is limited. `429 rate_limited` when the game sent 20 invitations in the last hour, when this
        game invited this address 3 times in the last day, or when this address received 5 invitations from all
        games in the last day.
      security:
        - developerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
            example:
              email: carol@example.com
      responses:
        "201":
          description: The invitation, as the owner sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameInvite"
              example:
                id: 5c2e8a10-7d3b-4f19-a6e4-3b9c1d0f8a27
                email: carol@example.com
                invitedByName: Ali
                createdAt: "2026-11-17T10:00:00Z"
                expiresAt: "2026-11-24T10:00:00Z"
        "400":
          description: |
            `invalid_email` (not a plain address like `dev@example.com`) or `invalid_json` (also for unknown fields,
            such as a game or a developer in the body: those come from the path and the login).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_email
                  message: Email address is not valid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "404":
          $ref: "#/components/responses/GameNotFound"
        "409":
          description: A developer with that address is already on the game, as an owner or a member (`already_member`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: already_member
                  message: This developer is already on the game
        "429":
          description: Over one of the limits above (`rate_limited`). Nothing was created and no email was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: rate_limited
                  message: This person was invited to this game several times today. Try again tomorrow.
    get:
      tags: [invites]
      operationId: listGameInvites
      summary: List a game's pending invitations
      description: |
        The invitations that are waiting for an answer and have not expired, newest first. Only the game's owner
        can list them (403 `owner_required` for a member, 404 for a developer who is not in the game).
      security:
        - developerToken: []
      responses:
        "200":
          description: The pending invitations. An empty list when there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameInviteList"
              example:
                invites:
                  - id: 5c2e8a10-7d3b-4f19-a6e4-3b9c1d0f8a27
                    email: carol@example.com
                    invitedByName: Ali
                    createdAt: "2026-11-17T10:00:00Z"
                    expiresAt: "2026-11-24T10:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "404":
          $ref: "#/components/responses/GameNotFound"
  /api/v1/games/{gameID}/invites/{inviteID}:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/InviteID"
    delete:
      tags: [invites]
      operationId: cancelGameInvite
      summary: Take an invitation back
      description: |
        Only the game's owner can (403 `owner_required` for a member, 404 for a developer who is not in the game).
        The invitation is deleted and can no longer be accepted.
      security:
        - developerToken: []
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrOwner"
        "404":
          $ref: "#/components/responses/InviteNotFound"
  /api/v1/invites:
    get:
      tags: [invites]
      operationId: listMyInvites
      summary: List the invitations sent to me
      description: |
        The invitations that wait for the logged-in developer: the ones sent to the email address of their account,
        newest first, not expired. An invitation is for an address, so it shows for the account that has it and for
        nobody else. Open to a suspended developer (reading); answering is not.
      security:
        - developerToken: []
      responses:
        "200":
          description: The invitations. An empty list when there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyInviteList"
              example:
                invites:
                  - id: 5c2e8a10-7d3b-4f19-a6e4-3b9c1d0f8a27
                    gameId: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                    gameName: Space Raiders
                    invitedByName: Ali
                    createdAt: "2026-11-17T10:00:00Z"
                    expiresAt: "2026-11-24T10:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/invites/{inviteID}/accept:
    parameters:
      - $ref: "#/components/parameters/InviteID"
    post:
      tags: [invites]
      operationId: acceptInvite
      summary: Accept an invitation
      description: |
        Makes the logged-in developer a `member` of the game and deletes the invitation, in one step. The
        invitation must have been sent to the email address of their account: somebody else's invitation and
        one that does not exist are both 404 `invite_not_found`, so an ID tells nothing. One that is theirs but
        past its 7 days is 410 `invite_expired` and makes nobody a member. Accepting is a write, so a suspended
        developer gets 403 `account_suspended`. No body.
      security:
        - developerToken: []
      responses:
        "200":
          description: "The game, with `role: member`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
              example:
                id: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                role: member
                name: Space Raiders
                description: Browser shooter, 2 to 4 players
                allowedOrigins: []
                createdAt: "2026-11-07T09:30:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrOrigin"
        "404":
          $ref: "#/components/responses/InviteNotFound"
        "410":
          description: The invitation is for this account but has expired (`invite_expired`). Ask the owner for a new one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invite_expired
                  message: This invitation has expired. Ask the game's owner to send a new one.
  /api/v1/invites/{inviteID}/decline:
    parameters:
      - $ref: "#/components/parameters/InviteID"
    post:
      tags: [invites]
      operationId: declineInvite
      summary: Decline an invitation
      description: |
        Deletes an invitation sent to the logged-in developer's address; nothing else happens (the owner can
        invite again). Somebody else's invitation and one that does not exist are both 404 `invite_not_found`.
        No body.
      security:
        - developerToken: []
      responses:
        "204":
          description: Declined.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrOrigin"
        "404":
          $ref: "#/components/responses/InviteNotFound"
  /api/v1/games/{gameID}/api-keys:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      tags: [api-keys]
      operationId: listApiKeys
      summary: List a game's API keys
      description: |
        Active and revoked keys, newest first. Only the prefix is shown, never the full key.
        Only the game's owner can list its keys: a member of the game gets 403 `owner_required`, and a developer who is not in it gets 404.
      security:
        - developerToken: []
      responses:
        "200":
          description: The game's keys. An empty list when there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
              example:
                apiKeys:
                  - id: 3b1c6f0e-9d2a-4a53-8f0b-7a9d2f6c1e44
                    gameId: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                    keyPrefix: clk_Ab3x
                    createdAt: "2026-11-07T10:00:00Z"
                    revokedAt: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "404":
          $ref: "#/components/responses/GameNotFound"
    post:
      tags: [api-keys]
      operationId: createApiKey
      summary: Create an API key
      description: |
        Generates a random key. **The full key is in this response only**; the database keeps
        just a hash, so it cannot be shown again. Keep it on the game's own server, never in
        browser code. No request body. Only the game's owner can create keys: a member of the game gets 403
        `owner_required`, and a developer who is not in it gets 404.
      security:
        - developerToken: []
      responses:
        "201":
          description: Key created. The response is not cacheable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewApiKey"
              example:
                id: 3b1c6f0e-9d2a-4a53-8f0b-7a9d2f6c1e44
                gameId: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                keyPrefix: clk_Ab3x
                createdAt: "2026-11-07T10:00:00Z"
                revokedAt: null
                key: clk_Ab3xQ0m7w2n5v8k1p4s9d6f3g0h7j2l5z8c1x4b7n0m
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "404":
          $ref: "#/components/responses/GameNotFound"
  /api/v1/games/{gameID}/allowed-origins:
    parameters:
      - $ref: "#/components/parameters/GameID"
    put:
      tags: [games]
      operationId: setAllowedOrigins
      summary: Set the websites allowed to open a WebSocket for a game
      description: |
        Only the game's owner can set them: a member of the game gets 403 `owner_required`, and a developer who is
        not in it gets 404.

        Replaces the whole list. Realtime accepts a WebSocket from a browser only when the page's
        `Origin` is one of these (once realtime uses the list; see the internal config endpoint).
        Each origin is written as the browser sends it in the `Origin` header: `http` or `https`, then
        the host and, when it is not the default, the port, for example `https://play.example.com` or
        `http://localhost:5174`. No path, query, trailing slash or user name, and no wildcard.
        Hosts are lower-cased and repeats are dropped. At most 20 origins, 255 characters each.
        An empty list clears the setting. Nothing is saved when one origin is invalid.
        Only the game's owner can set it; for anyone else the game does not exist (404).
      security:
        - developerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAllowedOriginsRequest"
            example:
              allowedOrigins: ["https://play.example.com", "http://localhost:5174"]
      responses:
        "200":
          description: The game with its new list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
              example:
                id: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                name: Space Raiders
                description: Browser shooter, 2 to 4 players
                allowedOrigins: ["https://play.example.com", "http://localhost:5174"]
                createdAt: "2026-11-07T09:30:00Z"
        "400":
          description: |
            Invalid input. `code` is `invalid_origins` (a bad origin, too many, or `allowedOrigins`
            missing or null) or `invalid_json` (also for unknown fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_origins
                  message: '"*" is not a valid origin: wildcards are not supported. Use scheme://host[:port], like https://play.example.com'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "404":
          $ref: "#/components/responses/GameNotFound"
  /api/v1/games/{gameID}/widget/draft:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      tags: [widget]
      operationId: getWidgetDraft
      summary: Get a game's widget draft
      description: |
        The config the developer is editing. When nothing was saved yet it returns the default
        config and `updatedAt` is null. Players never see drafts, only published versions.
        Only the game's owner can read it; for anyone else the game does not exist (404).
      security:
        - developerToken: []
      responses:
        "200":
          description: The current draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetDraft"
              example:
                config: *validConfig
                updatedAt: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/GameNotFound"
    put:
      tags: [widget]
      operationId: saveWidgetDraft
      summary: Save a game's widget draft
      description: |
        Replaces the whole draft with the config in the body. The config must be a JSON object
        of at most 64 KB. Only the game's owner can save it; for anyone else the game does not
        exist (404).
      security:
        - developerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveWidgetDraftRequest"
            example:
              config: *validConfig
      responses:
        "200":
          description: The saved draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetDraft"
              example:
                config: *validConfig
                updatedAt: "2026-11-08T12:00:00Z"
        "400":
          description: |
            Invalid input. `code` is `invalid_widget_config` when the config breaks the config v1
            contract, or `invalid_json` when the request body itself is not valid JSON.

            For `invalid_widget_config`, `error.details` lists every problem at once as
            `{ path, rule, message }`: `path` is a JSON Pointer into the config (`""` is the whole
            document), `rule` is the JSON Schema keyword that failed (`required`,
            `additionalProperties`, `pattern`, `maximum`, ...). A config over 64 KB gives one issue
            with rule `size`, and text that is not JSON gives one issue with rule `json`.
            Clients should rely on `path` and `rule`; `message` is for people. Nothing is saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_widget_config
                  message: "Config is not valid: 2 problems, see details"
                  details:
                    - path: /chat/maxMessageLength
                      rule: maximum
                      message: must be at most 1000
                    - path: /clan/maxMembers
                      rule: maximum
                      message: must be at most 200
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrOrigin"
        "404":
          $ref: "#/components/responses/GameNotFound"
  /api/v1/games/{gameID}/widget/publish:
    parameters:
      - $ref: "#/components/parameters/GameID"
    post:
      tags: [widget]
      operationId: publishWidget
      summary: Publish the widget draft
      description: |
        Publishes the saved draft as the next version of the game's widget (1, 2, 3 ...).
        No request body: the server publishes the draft it holds, so a stale browser tab cannot
        publish a different config. Wait until the last draft save has finished before calling it.
        The draft stays as it is. Only the game's owner can publish; for anyone else the game does
        not exist (404).
      security:
        - developerToken: []
      responses:
        "201":
          description: Published. The response is the new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetVersion"
              example:
                version: 3
                publishedAt: "2026-11-08T12:00:00Z"
                publishedBy: 5c0e7d9a-3b6f-4c58-9a21-1d8e4f7b2a60
                config: *validConfig
        "400":
          description: |
            The saved draft is not accepted any more (`invalid_widget_config`, with `error.details`
            as for saving a draft), for example because the rules became stricter after it was
            saved. Save a corrected draft and publish again. Nothing is published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_widget_config
                  message: "Config is not valid: 2 problems, see details"
                  details:
                    - path: /chat/maxMessageLength
                      rule: maximum
                      message: must be at most 1000
                    - path: /clan/maxMembers
                      rule: maximum
                      message: must be at most 200
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrOrigin"
        "404":
          $ref: "#/components/responses/GameNotFound"
        "409":
          description: Nothing was saved yet, so there is nothing to publish (`widget_draft_missing`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: widget_draft_missing
                  message: Save a draft before publishing
  /api/v1/games/{gameID}/widget/versions:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      tags: [widget]
      operationId: listWidgetVersions
      summary: List published widget versions
      description: |
        Newest first, without the configs (read one with `GET .../versions/{version}`).
        An empty list when the widget was never published. Only the game's owner can list them;
        for anyone else the game does not exist (404).
      security:
        - developerToken: []
      responses:
        "200":
          description: The published versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetVersionList"
              example:
                versions:
                  - version: 2
                    publishedAt: "2026-11-08T12:00:00Z"
                    publishedBy: 5c0e7d9a-3b6f-4c58-9a21-1d8e4f7b2a60
                  - version: 1
                    publishedAt: "2026-11-07T18:30:00Z"
                    publishedBy: 5c0e7d9a-3b6f-4c58-9a21-1d8e4f7b2a60
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/GameNotFound"
  /api/v1/games/{gameID}/widget/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/WidgetVersionNumber"
    get:
      tags: [widget]
      operationId: getWidgetVersion
      summary: Get one published widget version
      description: |
        A published version with its config, for example to preview it or to copy it into the draft
        with `PUT .../draft`. A number that is not a positive whole number is a version that does
        not exist (404). Only the game's owner can read it.
      security:
        - developerToken: []
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetVersion"
              example:
                version: 1
                publishedAt: "2026-11-07T18:30:00Z"
                publishedBy: 5c0e7d9a-3b6f-4c58-9a21-1d8e4f7b2a60
                config: *validConfig
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/WidgetVersionNotFound"
  /api/v1/games/{gameID}/widget/versions/{version}/rollback:
    parameters:
      - $ref: "#/components/parameters/GameID"
      - $ref: "#/components/parameters/WidgetVersionNumber"
    post:
      tags: [widget]
      operationId: rollbackWidget
      summary: Roll back to an earlier widget version
      description: |
        Publishes the config of that version again, as a **new** version on top of the history
        (rolling back to 1 when 2 exists makes version 3). Nothing is deleted or changed, and the
        draft is left alone: to edit the old config, read it with `GET .../versions/{version}` and
        save it with `PUT .../draft`. No request body. Only the game's owner can roll back.
      security:
        - developerToken: []
      responses:
        "201":
          description: Rolled back. The response is the new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetVersion"
              example:
                version: 3
                publishedAt: "2026-11-08T12:05:00Z"
                publishedBy: 5c0e7d9a-3b6f-4c58-9a21-1d8e4f7b2a60
                config: *validConfig
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AccountSuspendedOrOrigin"
        "404":
          description: No such game (`game_not_found`) or no such version (`widget_version_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: widget_version_not_found
                  message: Widget version not found
  /api/v1/api-keys/{keyID}:
    delete:
      tags: [api-keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: |
        The key stops working immediately and stays in the list marked revoked.
        Revoking an already revoked key succeeds. Only an owner of the key's game can revoke it:
        a member of the game gets 403 `owner_required`, and for a developer who is not in it the key does not exist (404).
      security:
        - developerToken: []
      parameters:
        - name: keyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Key revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OwnerRequired"
        "404":
          description: No such key, or it belongs to a game the developer is not in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: api_key_not_found
                  message: API key not found
  /api/v1/public/games/{gameID}/widget-config:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      tags: [public]
      operationId: getPublicWidgetConfig
      summary: Get the published widget config of a game
      description: |
        What the clan widget on a game's page loads to know how to look. It returns the **latest
        published version** (a publish or a rollback makes a new latest version). A draft is never
        returned, however recently it was saved.

        No login, no API key: the game ID is public, and the answer holds only the config and its
        version number (not who published it or when). Any website may call it
        (`Access-Control-Allow-Origin: *`, `ETag` readable from JavaScript); every other route keeps
        the origin list. A game that does not exist and a game that was never published get the same
        404 `widget_not_published`, so the route does not reveal which game IDs exist. A game that is
        suspended answers 403 `game_suspended` instead, even if it was never published.

        **Caching.** Every 200 and 304 carries a strong `ETag` such as `"v3"`: the version number,
        so it changes only when a publish or rollback adds a version. Send it back in
        `If-None-Match` to get `304 Not Modified` with no body. `Cache-Control` is
        `public, max-age=60`, so browsers and a CDN keep the answer for a minute and a new publish
        reaches players within about that time. Errors are sent with `Cache-Control: no-store`.

        **Load and rate limits.** The route is meant to be cached in front of the service. There is
        no rate limit in the service itself; put a CDN or reverse-proxy limit in front of
        `/api/v1/public/` before heavy production use. Each uncached call is one indexed query.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of the copy the page already has. A match returns 304.
          schema:
            type: string
          example: '"v3"'
      responses:
        "200":
          description: The latest published config.
          headers:
            ETag:
              description: Strong ETag, the version number in quotes.
              schema:
                type: string
              example: '"v3"'
            Cache-Control:
              schema:
                type: string
              example: public, max-age=60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWidgetConfig"
              example:
                version: 3
                config: *validConfig
        "304":
          description: The page already has this version. No body.
          headers:
            ETag:
              schema:
                type: string
              example: '"v3"'
            Cache-Control:
              schema:
                type: string
              example: public, max-age=60
        "403":
          description: |
            The game is suspended (`game_suspended`): the game itself or its developer is switched off by the
            distributor. The same code is used for both, because players must not see a message about someone
            else's contract. Checked before the config is read, so no config and no 304 is sent. The answer
            is never cached, but a browser or CDN may still hold an earlier 200 for up to 60 seconds.
            The SDK removes the panel silently and stops asking.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: game_suspended
                  message: This game is suspended
        "404":
          description: The game has no published widget (or no such game).
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: widget_not_published
                  message: This game has no published widget
  /api/v1/players/auth:
    post:
      tags: [players]
      operationId: authPlayer
      summary: Get a player token
      description: |
        Called by the **game's own server**, never by a browser: the API key must stay secret.
        The game has already logged its player in with its own account system; this call
        vouches for that player and returns a short-lived token for the browser and the SDK.

        The token is an Ed25519 JWT (`typ` "player") with the claims `sub` (the game's player ID),
        `gid` (the game the API key belongs to), `name` (display name), `iat` and `exp`.
        It is valid for 1 hour. The game cannot be chosen in the body: it is always the key's game.
        Social checks the token with platform's public key and never calls platform.

        The key is checked before the body, so a wrong key gets 401 whatever the body holds. After a valid
        key, a suspended game or developer gets 403 whatever the body holds, and no token is issued.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerAuthRequest"
            example:
              externalPlayerId: u_42
              displayName: Rashad
      responses:
        "200":
          description: Token issued. The response is not cacheable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerAuthResponse"
              example:
                token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                expiresIn: 3600
        "400":
          description: |
            Invalid input. `code` is `invalid_external_player_id`, `invalid_display_name`
            or `invalid_json` (also for unknown fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_display_name
                  message: displayName must be 1 to 50 characters without control characters
        "401":
          description: The `X-API-Key` header is missing, or the key is wrong or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_api_key
                  message: API key is missing, wrong or revoked
        "403":
          description: |
            The key is valid but the game may not use the product. `account_suspended`: the developer is
            suspended (all their games are). `game_suspended`: only this game is. Every key of the game is
            refused, old or new, and all work again at once when the game is resumed. Also
            `origin_not_allowed` for a browser call from a website that is not in the allowed origins.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                account_suspended:
                  value:
                    error:
                      code: account_suspended
                      message: The developer account is suspended
                game_suspended:
                  value:
                    error:
                      code: game_suspended
                      message: This game is suspended
                origin_not_allowed:
                  value:
                    error:
                      code: origin_not_allowed
                      message: This website is not allowed to call the API
  /internal/v1/games/{gameID}/config:
    parameters:
      - $ref: "#/components/parameters/GameID"
    get:
      tags: [internal]
      operationId: getInternalGameConfig
      summary: A game's status, active config and allowed origins (for realtime)
      description: |
        For other services, not for browsers or the SDK: realtime reads it to check the `Origin` of a
        WebSocket against the game's `allowedOrigins`, to know the game's chat rules and to know whether
        the game is served at all.

        `status` is the **effective** status, worked out here so that other services never need to know
        about developers: `suspended` when the game or its developer is suspended, otherwise `active`
        (the same rule that gives a game's keys a 403 on `POST /api/v1/players/auth`). It is read
        fresh on every call. A change is also announced on `socialkit.events` as `game.suspended` or
        `game.resumed` (see the README, "RabbitMQ events"), but this answer is the truth to check
        when an event was missed.
        Needs `X-Internal-Token` (the value of `PLATFORM_INTERNAL_TOKEN`); a developer or player token
        is not accepted. While `PLATFORM_INTERNAL_TOKEN` is not set, this route answers 404 `not_found`,
        like an unknown route.

        `config` is the newest **published** version (never a draft), the same document as
        `GET /api/v1/public/games/{gameID}/widget-config`. A game that exists but was never published
        is not an error: `version` is 0 and `config` is null, and `allowedOrigins` is still there.
        `allowedOrigins` is the list the developer set with `PUT /api/v1/games/{gameID}/allowed-origins`;
        an empty list means none were set (what that means for a WebSocket is realtime's rule).
        The answer is never cached.
      security:
        - internalToken: []
      responses:
        "200":
          description: The game's status, active config and allowed origins.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalGameConfig"
              example:
                gameId: 0d6f2c0e-5b1a-4f5e-8f55-2f4f0c7a9b11
                version: 3
                status: active
                config: *validConfig
                allowedOrigins: ["https://play.example.com", "http://localhost:5174"]
        "401":
          description: |
            `X-Internal-Token` is missing or wrong. Code: `invalid_internal_token`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_internal_token
                  message: Send the internal token in the X-Internal-Token header
        "404":
          description: |
            No such game, or a malformed ID (`game_not_found`), or the internal endpoints are switched
            off (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: game_not_found
                  message: Game not found
components:
  parameters:
    GameID:
      name: gameID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeveloperID:
      name: developerID
      in: path
      required: true
      description: A developer on the game.
      schema:
        type: string
        format: uuid
    InviteID:
      name: inviteID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      description: Page size, 1 to 100. Default 25.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PageCursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page. Omit for the first page.
      schema:
        type: string
    WidgetVersionNumber:
      name: version
      in: path
      required: true
      description: Published version number, 1 or higher.
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    developerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Developer token (typ "developer") returned by login. Used by the dashboard.
    refreshCookie:
      type: apiKey
      in: cookie
      name: clan_refresh
      description: |
        Refresh token of a developer session, set by login as an HttpOnly cookie for the path
        `/api/v1/developers`. Only `token/refresh` and `logout` read it. JavaScript cannot read it.
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin token (typ "admin") returned by `/api/v1/admin/login`. Used by the admin panel; no other route accepts it.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Secret API key of a game. Only the game's own server sends it, never a browser.
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Shared secret for the /internal endpoints (`PLATFORM_INTERNAL_TOKEN`), used only by other services, for now the realtime service.
  schemas:
    Status:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok, ready]
        service:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        name:
          type: string
          minLength: 1
          maxLength: 100
    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The token from the reset link (the part after `#token=`).
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    VerifyRegistrationRequest:
      type: object
      required: [email, code]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: The 6-digit code from the email.
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [token, expiresIn]
      properties:
        token:
          type: string
          description: Developer JWT (`typ` "developer", Ed25519).
        expiresIn:
          type: integer
          description: Seconds until the token expires.
    AdminLoginResponse:
      type: object
      required: [token, expiresIn]
      properties:
        token:
          type: string
          description: Admin JWT (`typ` "admin", Ed25519).
        expiresIn:
          type: integer
          description: Seconds until the token expires (`PLATFORM_ADMIN_TOKEN_TTL`).
    Admin:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    SetStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/AccountStatus"
        reason:
          type: string
          enum: [non_payment, abuse, other]
          description: Required when `status` is `suspended`. The developer sees a message for this code, never the note.
        note:
          type: string
          maxLength: 1000
          description: Internal text for the audit log. Never returned by a developer route.
    AdminDeveloperSummary:
      type: object
      required: [id, email, name, status, gameCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        gameCount:
          type: integer
          description: How many games the developer is on, as owner or member, whatever their status.
        createdAt:
          type: string
          format: date-time
    AdminDeveloperList:
      type: object
      required: [developers, nextCursor]
      properties:
        developers:
          type: array
          items:
            $ref: "#/components/schemas/AdminDeveloperSummary"
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last page.
    AccountStatus:
      type: string
      enum: [active, suspended]
    AdminGame:
      type: object
      required: [id, name, description, status, statusReason, statusChangedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        statusReason:
          type: string
          nullable: true
          description: Why the game was suspended (`non_payment`, `abuse` or `other`); null if it never was.
        statusChangedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        role:
          type: string
          enum: [owner, member]
          description: |
            Only in the list of games of `GET /api/v1/admin/developers/{developerID}`: the developer's role on the game.
            Absent in the other places a game is shown.
    AdminDeveloper:
      type: object
      required: [id, email, name, status, statusReason, statusChangedAt, createdAt, games]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        statusReason:
          type: string
          nullable: true
          description: Why the developer was suspended (`non_payment`, `abuse` or `other`); null if never.
        statusChangedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        games:
          type: array
          items:
            $ref: "#/components/schemas/AdminGame"
    AuditEntry:
      type: object
      required: [id, actor, action, targetType, targetId, reason, note, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
          description: The admin's ID, or `system:...` for automation.
        action:
          type: string
          enum: [developer.suspended, developer.resumed, game.suspended, game.resumed]
        targetType:
          type: string
          enum: [developer, game]
        targetId:
          type: string
          format: uuid
        reason:
          type: string
        note:
          type: string
          nullable: true
          description: Internal text; never shown to the developer.
        createdAt:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; null on the last page.
    Developer:
      type: object
      required: [id, email, name, createdAt, status, statusReason]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AccountStatus"
        statusReason:
          type: string
          nullable: true
          enum: [non_payment, abuse, other]
          description: |
            Why the account is suspended, so the dashboard can explain it; null while `active`. The
            admin's internal note is never part of any developer response.
    RegisterGameRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
    Game:
      type: object
      required: [id, role, name, description, allowedOrigins, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, member]
          description: |
            The logged-in developer's role on this game. An `owner` may do everything, including API keys, allowed
            origins and the team; a `member` sees the game, edits the draft, publishes and rolls back, and gets 403
            `owner_required` for the owner-only actions.
        name:
          type: string
        description:
          type: string
          description: Empty string when none was given.
        allowedOrigins:
          type: array
          description: |
            The websites allowed to open a WebSocket for this game (see `PUT .../allowed-origins`).
            Empty until the developer sets some.
          items:
            type: string
            example: https://play.example.com
        createdAt:
          type: string
          format: date-time
    GameMember:
      type: object
      required: [developerId, name, email, role, joinedAt]
      properties:
        developerId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, member]
        joinedAt:
          type: string
          format: date-time
    SetRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [owner, member]
    TransferOwnershipRequest:
      type: object
      required: [developerId]
      additionalProperties: false
      properties:
        developerId:
          type: string
          format: uuid
          description: The member who becomes an owner. They have to be on the game already.
    TeamLogPerson:
      type: object
      required: [developerId, name, email]
      properties:
        developerId:
          type: string
          format: uuid
          nullable: true
          description: Null for an invitation to an address that has no account.
        name:
          type: string
          description: Empty when there is no account.
        email:
          type: string
    TeamLogEntry:
      type: object
      required: [id, action, actor, subject, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - invite_sent
            - invite_cancelled
            - invite_accepted
            - invite_declined
            - member_removed
            - member_left
            - role_changed
            - ownership_transferred
        actor:
          $ref: "#/components/schemas/TeamLogPerson"
        subject:
          $ref: "#/components/schemas/TeamLogPerson"
        role:
          type: string
          enum: [owner, member]
          nullable: true
          description: The new role of a `role_changed`; null for every other action.
        createdAt:
          type: string
          format: date-time
    TeamLogPage:
      type: object
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/TeamLogEntry"
        nextCursor:
          type: string
          nullable: true
          description: Pass it as `cursor` for the next page; null on the last page.
    AdminGameMember:
      type: object
      required: [developerId, name, email, role, status, joinedAt]
      properties:
        developerId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, member]
        status:
          $ref: "#/components/schemas/AccountStatus"
        joinedAt:
          type: string
          format: date-time
    AdminGameDetail:
      allOf:
        - $ref: "#/components/schemas/AdminGame"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              description: Owners first, then members, each by when they joined.
              items:
                $ref: "#/components/schemas/AdminGameMember"
    InviteRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The address to invite. Lower-cased; it need not have an account yet.
    GameInvite:
      type: object
      required: [id, email, invitedByName, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        invitedByName:
          type: string
        createdAt:
          type: string
          format: date-time
          description: When it was sent, or last renewed.
        expiresAt:
          type: string
          format: date-time
          description: 7 days after it was sent or renewed.
    GameInviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/GameInvite"
    MyInvite:
      type: object
      required: [id, gameId, gameName, invitedByName, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        gameName:
          type: string
        invitedByName:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    MyInviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/MyInvite"
    GameMemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/GameMember"
    SetAllowedOriginsRequest:
      type: object
      required: [allowedOrigins]
      additionalProperties: false
      properties:
        allowedOrigins:
          type: array
          maxItems: 20
          description: The whole new list; `[]` clears it. Each item is `scheme://host[:port]`, no wildcard.
          items:
            type: string
            maxLength: 255
    InternalGameConfig:
      type: object
      required: [gameId, version, status, config, allowedOrigins]
      properties:
        gameId:
          type: string
          format: uuid
        version:
          type: integer
          description: The newest published version, 0 when the game was never published.
        status:
          type: string
          enum: [active, suspended]
          description: |
            Whether the game is served. `suspended` when the game or its developer is suspended; which of
            the two is not revealed. The config and origins are still returned for a suspended game.
        config:
          type: object
          nullable: true
          description: The config of that version (config v1), null when `version` is 0.
        allowedOrigins:
          type: array
          items:
            type: string
          description: Empty when the developer set none.
    GameList:
      type: object
      required: [games]
      properties:
        games:
          type: array
          items:
            $ref: "#/components/schemas/Game"
    ApiKey:
      type: object
      required: [id, gameId, keyPrefix, createdAt, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        keyPrefix:
          type: string
          description: First 8 characters of the key (`clk_` and 4 more), to recognise it.
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
          description: When the key was revoked; null while it is active.
    NewApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The full secret key. Returned only by the create call and never stored.
    ApiKeyList:
      type: object
      required: [apiKeys]
      properties:
        apiKeys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    SaveWidgetDraftRequest:
      type: object
      required: [config]
      properties:
        config:
          type: object
          description: |
            The widget config. It is checked against the config v1 contract (JSON Schema 2020-12,
            `docs/config-v1` in the clan-frontend repository) and must be at most 64 KB.
            Unknown fields are refused.
          additionalProperties: true
    WidgetDraft:
      type: object
      required: [config, updatedAt]
      properties:
        config:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the draft was last saved. Null while nothing was saved and `config` is the default.
    WidgetVersionSummary:
      type: object
      required: [version, publishedAt, publishedBy]
      properties:
        version:
          type: integer
          minimum: 1
          description: 1, 2, 3 ... per game. Never reused.
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
          format: uuid
          description: ID of the developer who published (or rolled back).
    WidgetVersion:
      allOf:
        - $ref: "#/components/schemas/WidgetVersionSummary"
        - type: object
          required: [config]
          properties:
            config:
              type: object
              additionalProperties: true
    PublicWidgetConfig:
      type: object
      description: The latest published config and its version. Nothing else.
      required: [version, config]
      properties:
        version:
          type: integer
          minimum: 1
        config:
          type: object
          description: The widget config JSON, as published.
          additionalProperties: true
    WidgetVersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/WidgetVersionSummary"
    PlayerAuthRequest:
      type: object
      required: [externalPlayerId, displayName]
      additionalProperties: false
      properties:
        externalPlayerId:
          type: string
          minLength: 1
          maxLength: 128
          description: The game's own ID for the player. Surrounding spaces are trimmed.
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: Name shown to other players. Surrounding spaces are trimmed.
    PlayerAuthResponse:
      type: object
      required: [token, expiresIn]
      properties:
        token:
          type: string
          description: Player JWT (`typ` "player", Ed25519). Hand it to the game's frontend.
        expiresIn:
          type: integer
          description: Seconds until the token expires (3600).
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable code, e.g. not_found, invalid_json, not_ready.
            message:
              type: string
              description: Human-readable explanation.
            details:
              type: array
              description: Only present for some codes. For `invalid_widget_config`, every problem found in the config.
              items:
                $ref: "#/components/schemas/ConfigIssue"
    ConfigIssue:
      type: object
      required: [path, rule]
      properties:
        path:
          type: string
          description: JSON Pointer to the field in the config, for example `/clan/maxMembers`. Empty for the whole document.
        rule:
          type: string
          description: The JSON Schema keyword that failed (`required`, `additionalProperties`, `type`, `enum`, `pattern`, `maximum`, ...), or `size` / `json` for a config that is too large or not JSON.
        message:
          type: string
          description: For people. Clients should rely on `path` and `rule`.
  responses:
    OwnerRequired:
      description: |
        Only the game's owner can do this (`owner_required`): the developer is a member of the game. The shared
        403s also apply: `account_suspended` on a write while the developer is suspended, and `origin_not_allowed`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: owner_required
              message: Only the game's owner can do this
    InviteNotFound:
      description: |
        No such invitation, or it was not sent to the logged-in developer's address, or (for an owner) it belongs
        to another game. These answer the same, so an ID tells nothing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invite_not_found
              message: Invitation not found
    AccountSuspendedOrOwner:
      description: |
        Only the game's owner can do this (`owner_required`, the developer is a member), or the developer's account
        is suspended (`account_suspended`), or the request came from a website that is not allowed
        (`origin_not_allowed`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: owner_required
              message: Only the game's owner can do this
    MemberNotFound:
      description: |
        The developer is not on the game (`member_not_found`), or the game does not exist or the caller is not on it
        (`game_not_found`: nobody learns that somebody else's game exists). The shared 403s apply too.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: member_not_found
              message: This developer is not on the game
    LastOwner:
      description: |
        The change would leave the game without an owner (`last_owner`). Nothing changed. Make another developer an
        owner first, or transfer the game.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: last_owner
              message: A game needs at least one owner. Make another developer an owner first.
    GameNotFound:
      description: No such game, or the developer is not in it. The two answer the same, so nobody learns that somebody else's game exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: game_not_found
              message: Game not found
    WidgetVersionNotFound:
      description: No such game, or the developer is not in it (`game_not_found`), or the game has no such version (`widget_version_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: widget_version_not_found
              message: Widget version not found
    RateLimited:
      description: Too many attempts. `Retry-After` says how many seconds to wait.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the limit starts again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: Too many attempts. Try again in a few minutes.
    Unauthorized:
      description: The developer token is missing, malformed, expired, of the wrong type, issued before the password was last reset, or its account no longer exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: A valid developer token is required
    AdminUnauthorized:
      description: The admin token is missing, malformed, expired, of the wrong type (a developer or player token), or its admin is disabled or gone.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: A valid admin token is required
    NotFound:
      description: No such route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Route not found
    OriginNotAllowed:
      description: The request came from a website that is not in the allowed origins.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: origin_not_allowed
              message: This website is not allowed to call the API
    AccountSuspendedOrOrigin:
      description: |
        `account_suspended`: the developer's account is suspended, so the dashboard is read-only. Logging
        in and every `GET` still work (`GET /api/v1/developers/me` says why), and so does revoking an API
        key; everything that changes data is refused until an admin resumes the account, and then it
        works again at once. Checked before the body is read. Also `origin_not_allowed` for a call from a
        website that is not in the allowed origins.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            account_suspended:
              value:
                error:
                  code: account_suspended
                  message: Your account is suspended. You can still view your data, but not change it.
            origin_not_allowed:
              value:
                error:
                  code: origin_not_allowed
                  message: This website is not allowed to call the API
    NotReady:
      description: The database is not reachable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_ready
              message: Database is not reachable
