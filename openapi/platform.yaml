              example:
                id: 3b0f1f0e-7c1d-4e53-9d2a-5b8e6a7c9d10
                name: Farm Friends
                description: Cozy farming game
                status: suspended
                statusReason: abuse
                statusChangedAt: "2026-11-12T12:00:00Z"
                createdAt: "2026-11-07T08:30:00Z"
        "400":
          description: |
            The body is not valid JSON (`invalid_json`), or a field is not valid: `invalid_status`,
            `reason_required` (suspending without a reason), `invalid_reason`, `invalid_note`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: reason_required
                  message: "A reason is required when suspending: non_payment, abuse or other"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          description: No such game (`game_not_found`); a malformed ID gives the same answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
