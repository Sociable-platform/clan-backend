# Copy this file to secrets.prod.yaml (or secrets.local.yaml) next to it and fill in real values.
# Files named secrets*.yaml are in .gitignore: never commit the real ones.
#
# Passwords: at least 12 letters and digits only, for example from:  openssl rand -hex 16
# Internal tokens: at least 32 characters, for example from:         openssl rand -hex 32
#
# The JWT key pair is not in this file: give the two PEM files with --set-file (see README.md).
secrets:
  postgresPassword: ""
  platformDbPassword: ""
  socialDbPassword: ""
  realtimeDbPassword: ""
  rabbitmqPassword: ""
  platformInternalToken: ""
  socialInternalToken: ""
  # Datadog -> Organization Settings -> API Keys. Needed when telemetry.collector.enabled (values-prod.yaml).
  datadogApiKey: ""
  # GitLab group clan-platform -> Settings -> Repository -> Deploy tokens, scope read_registry
  registryUsername: ""
  registryPassword: ""
