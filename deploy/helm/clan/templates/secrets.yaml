# Passwords and tokens of the whole platform. The values come from the secrets file at install
# time, never from the repository.
apiVersion: v1
kind: Secret
metadata:
  name: clan-secrets
  labels:
    {{- include "clan.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ include "clan.password" (dict "name" "postgresPassword" "value" .Values.secrets.postgresPassword) | b64enc }}
  platform-db-password: {{ include "clan.password" (dict "name" "platformDbPassword" "value" .Values.secrets.platformDbPassword) | b64enc }}
  social-db-password: {{ include "clan.password" (dict "name" "socialDbPassword" "value" .Values.secrets.socialDbPassword) | b64enc }}
  realtime-db-password: {{ include "clan.password" (dict "name" "realtimeDbPassword" "value" .Values.secrets.realtimeDbPassword) | b64enc }}
  rabbitmq-password: {{ include "clan.password" (dict "name" "rabbitmqPassword" "value" .Values.secrets.rabbitmqPassword) | b64enc }}
  platform-internal-token: {{ include "clan.token" (dict "name" "platformInternalToken" "value" .Values.secrets.platformInternalToken) | b64enc | quote }}
  social-internal-token: {{ include "clan.token" (dict "name" "socialInternalToken" "value" .Values.secrets.socialInternalToken) | b64enc | quote }}
  {{- if .Values.telemetry.collector.enabled }}
  # Only the OpenTelemetry Collector reads it.
  datadog-api-key: {{ required "secrets.datadogApiKey is required when telemetry.collector.enabled (Datadog: Organization Settings -> API Keys)" .Values.secrets.datadogApiKey | b64enc | quote }}
  {{- end }}
---
# Platform's private key: only platform mounts it (it signs the tokens).
apiVersion: v1
kind: Secret
metadata:
  name: clan-jwt-private
  labels:
    {{- include "clan.labels" . | nindent 4 }}
type: Opaque
data:
  platform_jwt_private.pem: {{ required "secrets.jwtPrivateKey is required: --set-file secrets.jwtPrivateKey=<private .pem>" .Values.secrets.jwtPrivateKey | b64enc }}
---
# Platform's public key: social and realtime mount it to check tokens.
apiVersion: v1
kind: Secret
metadata:
  name: clan-jwt-public
  labels:
    {{- include "clan.labels" . | nindent 4 }}
type: Opaque
data:
  platform_jwt_public.pem: {{ required "secrets.jwtPublicKey is required: --set-file secrets.jwtPublicKey=<public .pem>" .Values.secrets.jwtPublicKey | b64enc }}
{{- with .Values.secrets }}
{{- if and .registryUsername .registryPassword }}
---
# Lets the cluster pull the images from the group's private GitLab registries.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry
  labels:
    {{- include "clan.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  {{- $auth := printf "%s:%s" .registryUsername .registryPassword | b64enc }}
  {{- $server := dict "username" .registryUsername "password" .registryPassword "auth" $auth }}
  .dockerconfigjson: {{ dict "auths" (dict $.Values.registry.server $server) | toJson | b64enc }}
{{- end }}
{{- end }}
