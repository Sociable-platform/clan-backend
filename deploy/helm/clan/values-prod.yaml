# The Oracle server: one k3s node, ARM, 2 OCPU / 12 GB, 100 GB disk.
postgres:
  storage: 20Gi
rabbitmq:
  storage: 2Gi

# sslip.io answers every *.130-61-158-79.sslip.io with 130.61.158.79, so no DNS setup is needed.
# For an own domain, point *.<domain> at 130.61.158.79 and put it here.
ingress:
  domain: 130-61-158-79.sslip.io
  tls:
    enabled: true
    issuer: letsencrypt

# Traces and metrics go to the OpenTelemetry Collector that already runs on this server, outside
# this chart: Helm release in the "datadog" namespace, listening on the node's port 4317, with
# pipelines for traces, metrics and logs to Datadog. The services only need its address.
# The chart's own collector stays off here: it would ask for the same port and never start
# (its pod stays Pending, and the deploy then waits for it and fails).
# To switch telemetry off altogether, set telemetry.enabled to false.
telemetry:
  enabled: true
  collector:
    enabled: false

# Browser pages allowed to call each service: Studio (studio.<domain>) and the demo game
# (game.<domain>), plus the local dev servers so a local Studio or game can try the deployed backend.
platform:
  corsOrigins: https://studio.130-61-158-79.sslip.io,http://localhost:5173
social:
  corsOrigins: https://game.130-61-158-79.sslip.io,http://localhost:5174
realtime:
  corsOrigins: https://game.130-61-158-79.sslip.io,http://localhost:5174
